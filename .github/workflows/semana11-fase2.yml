name: Veltri - verificacion local
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'data/**'
      - 'evals/**'
      - 'frontend/**'
      - 'docs/*.bpmn'
      - 'docs/arquitectura.md'
      - 'docs/agentes/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.env.example'
      - 'docs/evidencias/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/semana11-fase2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      USE_MOCK_LLM: '1'
      VELTRI_TRACING_ENABLED: '0'
      VELTRI_TRACING_ALLOW_EXTERNAL: '0'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Instalar dependencias fijadas
        run: |
          python scripts/veltri_local.py instalar --desarrollo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $PWD ".venv/Scripts") >> $env:GITHUB_PATH
      - name: Despliegue nativo en Windows
        run: |
          (Get-CimInstance Win32_OperatingSystem).Caption
          python scripts/veltri_local.py comprobar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_despliegue_local.py
      - name: Pruebas de los cuatro pilares, prompts y autonomía
        run: >-
          python -m pytest -q tests/test_memoria_semana11.py tests/test_deep_agents_semana11.py
          tests/test_prompts_semana11.py tests/test_llm.py tests/test_autonomia_semana11.py
      - name: Trazabilidad SDD
        run: python -m pytest -q tests/test_trazabilidad_sdd.py tests/test_verificador.py
      - name: Evaluación local de 40 casos
        run: python scripts/evaluar_semana11.py
      - name: Evaluación económica local
        run: python -m pytest -q tests/test_economia.py
      - name: Demo de cuatro pilares
        run: python -m src.academic.deep_agents_semana11
      - name: Verificacion integral
        run: python scripts/verificar.py
